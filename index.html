<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ООО ЧОО «Сокол» — физическая охрана, видеонаблюдение, охранная и пожарная сигнализация, СКУД в Ярославле. На рынке охранных услуг с 2004 года." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>СОКОЛ — Группа компаний по обеспечению безопасности</title>
    <script>
      // GitHub Pages SPA fallback: restore the deep link encoded by 404.html
      // before React Router mounts. https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded[0] + (window.location.hash || ''),
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
