<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>СОКОЛ</title>
    <script>
      // GitHub Pages SPA fallback: encode the current deep link and redirect
      // to index.html, which restores it before React Router takes over.
      // https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // number of path segments that make up the base (/sokol_new/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
